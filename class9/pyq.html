<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Previous Year Questions (PYQ)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .question-box {
            background: #ffffff;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .question {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .options label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .options input {
            margin-right: 8px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Previous Year Questions (MCQs)</h1>

<!-- Question 1 -->
<div class="question-box">
    <div class="question">Q1. Which protocol is used to send emails?</div>
    <div class="options">
        <label><input type="radio" name="q1"> HTTP</label>
        <label><input type="radio" name="q1"> FTP</label>
        <label><input type="radio" name="q1"> SMTP</label>
        <label><input type="radio" name="q1"> POP3</label>
    </div>
</div>

<!-- Question 2 -->
<div class="question-box">
    <div class="question">Q2. What does CPU stand for?</div>
    <div class="options">
        <label><input type="radio" name="q2"> Central Processing Unit</label>
        <label><input type="radio" name="q2"> Computer Processing Unit</label>
        <label><input type="radio" name="q2"> Central Program Unit</label>
        <label><input type="radio" name="q2"> Control Processing Unit</label>
    </div>
</div>

<!-- Question 3 -->
<div class="question-box">
    <div class="question">Q3. Which of the following is NOT an input device?</div>
    <div class="options">
        <label><input type="radio" name="q3"> Keyboard</label>
        <label><input type="radio" name="q3"> Mouse</label>
        <label><input type="radio" name="q3"> Scanner</label>
        <label><input type="radio" name="q3"> Printer</label>
    </div>
</div>

<footer>
    © 2026 | PYQ Practice Page
</footer>

</body>
</html>
